plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "showcaser-common.mixins.json"
        mixinConfig "showcaser.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    modCompileOnly("curse.maven:applied-energistics-2-223794:7148487")
    // running this with MUI caused forge config read while init which resulted in crash
//    modLocalRuntime("curse.maven:guideme-1173950:7127447")
//    modLocalRuntime("curse.maven:applied-energistics-2-223794:7148487")

    modCompileOnly("curse.maven:ftb-quests-forge-289412:7608804")
    modCompileOnly("curse.maven:ftb-library-forge-404465:7296748")
    modCompileOnly("curse.maven:ftb-teams-forge-404468:7499810")
    // modCompileOnly("curse.maven:ftb-xmod-compat-889915:6402486")

    modLocalRuntime("curse.maven:ftb-quests-forge-289412:7608804")
    modLocalRuntime("curse.maven:ftb-library-forge-404465:7296748")
    modLocalRuntime("curse.maven:ftb-teams-forge-404468:7499810")
    modLocalRuntime("curse.maven:ftb-xmod-compat-889915:6402486")

    // remapping fails if jei-suggested dependency setup is used
//  modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
//  modLocalRuntime("mezz.jei:jei-${mc_version}-fabric:${jei_version}")

    modCompileOnly("curse.maven:jei-238222:7391695")
    modLocalRuntime("curse.maven:jei-238222:7391695")

    modCompileOnly("dev.emi:emi-forge:${emi_version}")
    modLocalRuntime("dev.emi:emi-forge:${emi_version}")

    // adding rei api to common with runtime to platform build.gradle crashes the game upon opening ae2 screen
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")

    // modLocalRuntime("curse.maven:embeddium-908741:5681725")

    // Modern UI
    dependencies {
        // modApi "fuzs.forgeconfigapiport:forgeconfigapiport-:${fcapi_version}"
        localRuntime("icyllis.modernui:ModernUI-Core:${modernui_version}")
        forgeRuntimeLibrary("icyllis.modernui:ModernUI-Core:${modernui_version}")
        // Modern UI core extensions
        // Markdown (<=3.11.1) / Markflow (>=3.12.0) is required, others are optional
        localRuntime("icyllis.modernui:ModernUI-Markflow:${modernui_version}")
        forgeRuntimeLibrary("icyllis.modernui:ModernUI-Markflow:${modernui_version}")
        // Choose one of Fabric or NeoForge
        modCompileOnly("icyllis.modernui:ModernUI-Forge:${minecraft_version}-${modernui_version}.+")
        modLocalRuntime("icyllis.modernui:ModernUI-Forge:${minecraft_version}-${modernui_version}.+")
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Patchouli
    modLocalRuntime("maven.modrinth:patchouli:${patchouli_version}-forge")
    modCompileOnly("maven.modrinth:patchouli:${patchouli_version}-forge")
    // to test patchouli
    modLocalRuntime("maven.modrinth:lexicon:v.1.5.4")

    // mixin extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.3"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
