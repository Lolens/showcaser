plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "showcaser-common.mixins.json"
        mixinConfig "showcaser.mixins.json"
        mixinConfig("showcaser-emi.mixins.json")
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    modCompileOnly("curse.maven:applied-energistics-2-223794:7148487")
    modLocalRuntime("curse.maven:guideme-1173950:7127447")
    modLocalRuntime("curse.maven:applied-energistics-2-223794:7148487")

    modCompileOnly("dev.emi:emi-forge:${emi_version}")
    modLocalRuntime("dev.emi:emi-forge:${emi_version}")

    // adding rei api to common with runtime to platform build.gradle crashes the game upon opening ae2 screen
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // mixin extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.3"))



}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
